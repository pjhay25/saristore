const categories=[{"name": "Noodles", "emoji": "🍜", "subtitle": "Instant noodles & cups", "className": "noodles"}, {"name": "Canned Goods", "emoji": "🥫", "subtitle": "Sardines, meat & more", "className": "canned"}, {"name": "Biscuits & Crackers", "emoji": "🍪", "subtitle": "Biscuits, cookies & wafers", "className": "biscuits"}, {"name": "Snacks", "emoji": "🍟", "subtitle": "Chips & savory snacks", "className": "snacks"}, {"name": "Candy & Sweets", "emoji": "🍬", "subtitle": "Candy, gum & chocolates", "className": "candy"}, {"name": "Coffee & Drinks", "emoji": "☕", "subtitle": "Coffee & powdered drinks", "className": "coffee"}, {"name": "Drinks", "emoji": "🥤", "subtitle": "Bottled drinks & water", "className": "drinks"}, {"name": "Condiments", "emoji": "🧂", "subtitle": "Sauces, oil & seasonings", "className": "condiments"}, {"name": "Laundry & Cleaning", "emoji": "🧼", "subtitle": "Laundry & dishwashing", "className": "cleaning"}, {"name": "Personal Care", "emoji": "🪥", "subtitle": "Bath & personal care", "className": "personal"}, {"name": "Paper & Hygiene", "emoji": "🧻", "subtitle": "Tissue & hygiene items", "className": "paper"}, {"name": "Fresh & Bakery", "emoji": "🍞", "subtitle": "Eggs & bread", "className": "bakery"}, {"name": "Store Supplies", "emoji": "🛍️", "subtitle": "Everyday store supplies", "className": "supplies"}, {"name": "Household", "emoji": "🧺", "subtitle": "Household essentials", "className": "household"}];
const home=document.getElementById('home'),inside=document.getElementById('inside'),searchResults=document.getElementById('searchResults');
const q=document.getElementById('q'),empty=document.getElementById('empty');let active=null;
document.getElementById('count').textContent=products.length+' products';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function listFor(c){return products.filter(p=>p.category===c);}
function hasIncrease(p){return p.oldPrice != null && Number.isFinite(Number(p.oldPrice)) && Number(p.price)>Number(p.oldPrice);}
function detailedCard(p){const up=hasIncrease(p);return `<div class="item${up?' increased':''}"><div class="item-name" title="${esc(p.name)}">${esc(p.name)}</div><div>${up?`<div class="old-price">₱${Number(p.oldPrice).toFixed(2)}</div>`:''}<div class="price">₱${Number(p.price||0).toFixed(2)}</div>${up?`<div class="increase-tag">↑ +₱${(Number(p.price)-Number(p.oldPrice)).toFixed(2)}</div>${p.sampleIncrease?'':''}`:''}</div></div>`;}
function card(p){const up=hasIncrease(p);return `<div class="item"><div class="item-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="price-line">${up?`<span class="old-price" title="Previous price">₱${Number(p.oldPrice).toFixed(2)}</span>`:''}<span class="price" title="${p.sampleIncrease?'Sample price only':'Current price'}">₱${Number(p.price||0).toFixed(2)}</span></div></div>`;}
const featuredNames=["Lucky Me Pancit Canton Kalamansi 80g", "Argentina Corned Beef 260g", "Sprite Mismo 290ml"];
const allIncreases=document.getElementById('allIncreases');
function renderIncreases(){const items=products.filter(hasIncrease);const featured=items.filter(p=>featuredNames.includes(p.name));const preview=[...featured,...items.filter(p=>!featuredNames.includes(p.name))].slice(0,3);const note=items.some(p=>p.sampleIncrease)?'':'Mga paninda na may bagong presyo.';document.getElementById('increaseSection').hidden=!items.length;document.getElementById('increaseCount').textContent=items.length+' products';document.getElementById('increaseNote').textContent=note;document.getElementById('allIncreaseNote').textContent=note;document.getElementById('allIncreaseCount').textContent=items.length+' products';document.getElementById('increaseProducts').innerHTML=`<div class="products">${preview.map(detailedCard).join('')}</div>`;document.getElementById('allIncreaseProducts').innerHTML=`<div class="products">${items.map(detailedCard).join('')}</div>`;document.getElementById('viewIncreases').hidden=items.length<=3;}
function openIncreases(){active=null;q.value='';home.style.display='none';inside.style.display='none';searchResults.style.display='none';empty.style.display='none';allIncreases.style.display='block';document.getElementById('helper').textContent='Mga paninda na may bagong presyo.';renderIncreases();window.scrollTo(0,0);}
function showList(target,items,groupNoodles=false){
 if(!items.length){target.innerHTML='';return;}
 if(groupNoodles&&active==='Noodles'){
  const groups=[{name:'Lucky Me',re:/lucky me|pancit canton/i},{name:'Nissin Ramen',re:/nissin|ramen/i},{name:'Cup Noodles',re:/cup noodles?/i}];
  let used=new Set(),out='';
  groups.forEach(g=>{let a=items.filter(p=>g.re.test(p.name));if(a.length){a.forEach(p=>used.add(p));out+=`<h3 class="group">${g.name}</h3><div class="products">${a.map(card).join('')}</div>`;}});
  let rest=items.filter(p=>!used.has(p));if(rest.length)out+=`<h3 class="group">Other Noodles</h3><div class="products">${rest.map(card).join('')}</div>`;
  target.innerHTML=out;
 }else target.innerHTML=`<div class="products">${items.map(card).join('')}</div>`;
}
function renderCategories(){
 document.getElementById('catGrid').innerHTML=categories.map(c=>`<button class="cat" type="button" data-cat="${esc(c.name)}"><span class="art ${esc(c.className)}"><b>${c.emoji}</b></span><span class="info"><span class="cat-name">${esc(c.name)}</span><span class="sub" title="${esc(c.subtitle)}">${esc(c.subtitle)}</span><span class="qty">${listFor(c.name).length} items</span></span></button>`).join('');
 document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>openCat(b.dataset.cat)));
}
function openCat(name){allIncreases.style.display='none';
 active=name;let c=categories.find(x=>x.name===name);home.style.display='none';searchResults.style.display='none';inside.style.display='block';empty.style.display='none';
 document.getElementById('catTitle').textContent=name;document.getElementById('catSubtitle').textContent=listFor(name).length+' products';
 document.getElementById('catIcon').textContent=c?c.emoji:'🛒';document.getElementById('catIcon').className='cat-icon '+(c?c.className:'general');
 document.getElementById('helper').textContent='Tingnan ang mga paninda sa ibaba.';showList(document.getElementById('catProducts'),listFor(name),true);
}
function goHome(){allIncreases.style.display='none';active=null;q.value='';inside.style.display='none';searchResults.style.display='none';home.style.display='block';empty.style.display='none';document.getElementById('helper').textContent='Pumili ng kategorya para makita ang mga paninda.';}
function searchNow(){
 let term=q.value.trim().toLowerCase();if(!term){if(active)openCat(active);else goHome();return;}
 active=null;allIncreases.style.display='none';home.style.display='none';inside.style.display='none';searchResults.style.display='block';
 let found=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(term));
 document.getElementById('found').textContent=found.length+' found';showList(document.getElementById('searchProducts'),found,false);
 empty.style.display=found.length?'none':'block';document.getElementById('helper').textContent='Search results for your product.';
}
document.getElementById('viewIncreases').addEventListener('click',openIncreases);document.getElementById('backIncreases').addEventListener('click',goHome);document.getElementById('back').addEventListener('click',goHome);q.addEventListener('input',searchNow);renderCategories();renderIncreases();
</script></body></html>
